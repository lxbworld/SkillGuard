# CI for SkillGuard: the cheap path.
#
# All four workflows were briefly disabled while the account's shared,
# free-plan Actions allowance was exhausted. The repository is public now, so
# Actions minutes are unlimited and everything is enabled again.
#
# This runs on every commit and pull request, on Linux only. It is ~1.5 billed
# minutes.
#
# The three-OS matrix is **not** here on purpose. `sgdir-v1` promises the same
# content produces the same digest on any machine, and two of its details (the
# executable bit and path separators) only differ on non-Unix platforms, so
# cross-platform coverage matters — it lives in `cross-platform.yml`, which runs
# on release tags, weekly, and on demand. On a free account the macOS runner is
# billed at 10x and Windows at 2x: the old per-commit matrix cost ~13.5 billed
# minutes for ~2.8 minutes of wall clock, and two of four jobs were 90% of the
# bill.

name: CI

on:
  push:
    branches: [main]
    # A documentation or corpus-data change cannot break the Rust code, and the
    # corpus tree is not even committed. Skipping these keeps the allowance for
    # the commits that matter.
    paths-ignore:
      - "research/**"
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    paths-ignore:
      - "research/**"
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"

permissions:
  contents: read

# Pushing three times in a row should cost one run, not three.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Build (release)
        run: cargo build --release

  # Supply-chain policy for the tool that is itself a supply-chain tool.
  # OS-independent, so one job.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Check licenses, advisories, bans and sources
        run: cargo deny check
